version: '3.8'

services:
  fileflow:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: fileflow
    restart: unless-stopped
    ports:
      - "${PORT:-8680}:${PORT:-8680}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-8680}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-8680}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# For local development with external Supabase
# Run: docker-compose up --build
