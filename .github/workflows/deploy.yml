name: Deploy to Railway

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations'
        required: false
        default: 'false'
        type: boolean

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set Railway environment variables
        run: |
          # Link to the project (uses RAILWAY_TOKEN from secrets)
          railway link --environment production

          # Set build-time variables
          railway variables set \
            VITE_API_URL="/api" \
            VITE_SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            VITE_SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          # Set runtime variables
          railway variables set \
            NODE_ENV="production" \
            SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET }}"

      - name: Run database migrations
        if: ${{ github.event.inputs.run_migrations == 'true' || contains(github.event.head_commit.message, '[migrate]') }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Running migrations..."
          for migration in migrations/*.sql; do
            echo "Running $migration..."
            psql "$SUPABASE_DB_URL" -f "$migration"
          done
          echo "Migrations complete!"

      - name: Deploy to Railway
        run: railway up --detach

      - name: Get deployment URL
        run: |
          echo "Deployment triggered!"
          echo "Check Railway dashboard for deployment status"
